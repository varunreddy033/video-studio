<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Studio</title>
<link rel="stylesheet" href="/ui/studio.css">
<script>try { const t = localStorage.getItem("vs.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preload" href="/ui/fonts/PlusJakartaSans-wght.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
<header class="top">
  <button class="burger" id="menuBtn" type="button" aria-label="Menu" aria-controls="menu" aria-expanded="false" title="Menu"><i></i></button>
  <a class="brand" href="#" id="homeLink" aria-label="Video Studio: new full video"><span class="mark" aria-hidden="true"></span><span class="bt">Video Studio</span></a>
  <div class="grow"></div>
  <div class="newwrap">
    <button class="btn primary" id="newBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="newMenu"><span class="plus" aria-hidden="true">+</span> New</button>
    <div class="popover" id="newMenu" role="menu" hidden>
      <div class="pophead">Video</div>
      <button class="popitem" id="fullBtn" type="button" role="menuitem"><span class="ico" aria-hidden="true">▶</span><span><b>Full video</b><small>16:9, chapters, 3 thumbnails</small></span></button>
      <button class="popitem" id="shortBtn" type="button" role="menuitem"><span class="ico" aria-hidden="true">▮</span><span><b>Short</b><small>vertical, 15 s to 2:00</small></span></button>
      <div class="pophead">Web series</div>
      <button class="popitem" id="newEpBtn" type="button" role="menuitem" aria-expanded="false"><span class="ico" aria-hidden="true">◆</span><span><b>New episode of a series</b><small>pick the series</small></span></button>
      <div class="popsub" id="newEpList" hidden></div>
      <button class="popitem" id="newSeriesBtn" type="button" role="menuitem"><span class="ico" aria-hidden="true">＋</span><span><b>New series</b><small>a bible, cast and sets</small></span></button>
    </div>
  </div>
</header>
<div class="shell">
  <nav class="drawer" id="menu" aria-label="Menu">
    <div class="msearch"><label class="vh" for="jobSearch">Search videos</label>
      <input id="jobSearch" type="search" placeholder="Search videos" autocomplete="off" spellcheck="false"><kbd aria-hidden="true">/</kbd></div>
    <div class="sec" data-sec="series">
      <button class="sech" type="button"><span class="ico" aria-hidden="true">◆</span>Series<span class="car" aria-hidden="true">▾</span></button>
      <div class="items" id="seriesTree"></div>
    </div>
    <div class="sec" data-sec="recent">
      <button class="sech" type="button"><span class="ico" aria-hidden="true">▶</span>Recent videos<span class="car" aria-hidden="true">▾</span></button>
      <div class="items">
        <div class="joblist" id="jobs"></div>
        <div class="jobtools" id="jobtools"></div>
      </div>
    </div>
    <div class="sec" data-sec="create">
      <button class="sech" type="button"><span class="ico" aria-hidden="true">＋</span>Create<span class="car" aria-hidden="true">▾</span></button>
      <div class="items">
        <button class="navlink" type="button" id="mkFull">Full video</button>
        <button class="navlink" type="button" id="mkShort">Short from scratch</button>
        <button class="navlink" type="button" id="mkClip">Short from a video I already made</button>
        <button class="navlink" type="button" id="mkSample">Load a sample<small>passes Check</small></button>
      </div>
    </div>
    <div class="sec" data-sec="studio">
      <button class="sech" type="button"><span class="ico" aria-hidden="true">⚙</span>Studio<span class="car" aria-hidden="true">▾</span></button>
      <div class="items">
        <div id="health"></div>
        <div class="themerow"><span>Theme</span><div class="seg tiny" id="themeSeg" role="group" aria-label="Theme"></div></div>
      </div>
    </div>
    <div class="sec" data-sec="account">
      <button class="sech" type="button"><span class="ico" aria-hidden="true">☺</span>Account<span class="car" aria-hidden="true">▾</span></button>
      <div class="items" id="userbox"></div>
    </div>
  </nav>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const STATUS = {
  script: ["Script saved", ""], queued: ["Queued", "info"], rendering: ["Rendering", "info"],
  draft_ready: ["Draft ready", "warn"], done: ["Final ready", "ok"], failed: ["Failed", "bad"],
};
const STAGE_ORDER = ["voice", "images + presenter", "visuals", "timeline", "picture (Remotion)", "captions", "audio mix", "encode", "mux"];
const STAGES = ["voice", "visuals", "captions", "audio mix", "encoding", "thumbnails"];
const TYPE_LABEL = { stock: "AI photo", ai: "AI image", card: "card", number: "number", quote: "quote", chart: "chart", line: "line" };
let health = {}, current = null, data = null, editText = null, lastReport = null, pollTimer = null, tab = null;
let newText = "", newKind = "full", loadedSample = "";   // full | short-choice | short | clip

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
// replaceChildren() would turn a null child into the text "null": drop empty children first
function fill(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); return el; }
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json", "X-VS": "1" }, ...opts });
  if (r.status === 401 && path !== "/api/password") { location.replace("/login"); throw new Error("logged out"); }
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
  return body;
}
function dur(s) { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), r = s % 60;
  if (m >= 60) return `${Math.floor(m / 60)} h ${m % 60} min`; return m ? (r ? `${m} min ${r} s` : `${m} min`) : `${r} s`; }
function ts(s) { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function when(t) { const d = new Date(t * 1000); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) +
  " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
const file = (name, extra = "") => `/api/jobs/${current}/file/${name}?v=${Math.round((data && data.updated) || 0)}${extra}`;

// ----------------------------------------------------------------- menu (the collapsible drawer)
// Open by default on wide screens (pushes the page), closed under 1100 px (slides over it). The wide-screen choice and
// which sections are open are remembered in this browser; storage can be missing (private window), so every access is guarded.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const WIDE = matchMedia("(min-width: 1100px)");
const SEC_DEFAULT = { series: true, recent: true, create: false, studio: true, account: true };
function menuOpen() { return document.body.classList.contains("menu-open"); }
function setMenu(open, remember = true) {
  document.body.classList.toggle("menu-open", open);
  $("#menuBtn").setAttribute("aria-expanded", String(open));
  if (remember && WIDE.matches) store.set("vs.menu", open);
}
function closeMenuIfOverlay() { if (!WIDE.matches && menuOpen()) setMenu(false, false); }
setMenu(WIDE.matches ? store.get("vs.menu", true) : false, false);
WIDE.addEventListener("change", () => setMenu(WIDE.matches ? store.get("vs.menu", true) : false, false));
$("#menuBtn").onclick = () => setMenu(!menuOpen());
$("#scrim").onclick = () => setMenu(false, false);
document.querySelectorAll(".sec").forEach((sec) => {
  const id = sec.dataset.sec, btn = sec.querySelector(".sech"), items = sec.querySelector(".items");
  if (!items.id) items.id = "sec-" + id; btn.setAttribute("aria-controls", items.id);
  const draw = (open) => { btn.setAttribute("aria-expanded", String(open)); items.hidden = !open; };
  draw(store.get("vs.menuSecs", SEC_DEFAULT)[id] ?? SEC_DEFAULT[id]);
  btn.onclick = () => { const open = btn.getAttribute("aria-expanded") !== "true"; draw(open);
    store.set("vs.menuSecs", { ...SEC_DEFAULT, ...store.get("vs.menuSecs", {}), [id]: open }); };
});
function openSec(id) { const sec = document.querySelector(`.sec[data-sec="${id}"]`), btn = sec && sec.querySelector(".sech");
  if (btn && btn.getAttribute("aria-expanded") !== "true") btn.click(); }
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || "") || (e.target || {}).isContentEditable;
  if (e.key === "Escape" && menuOpen() && !WIDE.matches) { setMenu(false, false); $("#menuBtn").focus(); }
  else if (e.key === "Escape" && e.target === $("#jobSearch")) { $("#jobSearch").value = ""; drawJobs(); $("#jobSearch").blur(); }
  else if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); if (!menuOpen()) setMenu(true, WIDE.matches); openSec("recent"); $("#jobSearch").focus(); }
});
document.addEventListener("click", (e) => {     // a click outside the overlay menu closes it
  if (!WIDE.matches && menuOpen() && !$("#menu").contains(e.target) && !$("#menuBtn").contains(e.target)) setMenu(false, false);
});

// ----------------------------------------------------------------- Studio section (this Mac's health)
async function loadHealth() {
  try { health = await api("/health"); } catch { health = {}; }
  drawHealth();
}
// With a video's Check report on screen, a click on a row opens that Look & sound tab (the rows show this Mac's set-up).
let headerReport = null;
function setHeaderLook(r) { headerReport = r && !isClip(r) ? r : null; }
function openLookTab(id) {
  const look = $("#look"), btn = look && look.querySelector(`.ltab[data-tab="${id}"]`);
  if (!btn) { toast(headerReport ? "That choice isn't available for this video" : "Open a video's script and press Check to change this for that video"); return; }
  closeMenuIfOverlay();
  const det = look.closest("details"); if (det) det.open = true;
  btn.click();
  ($("#look") || look).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
function drawHealth() {
  const c = $("#health"); if (!c) return;
  const row = (name, value, cls, title, onclick) => h("button", { class: "statusrow", type: "button", title, onclick }, h("span", {}, name), h("b", { class: cls }, value));
  const flux = health.local_image_model;
  const enc = (health.encoder || "").replace("h264_", "");
  const lib = [health.music_tracks != null ? `${health.music_tracks} music` : "", health.sfx_files != null ? `${health.sfx_files} SFX` : ""].filter(Boolean).join(" · ");
  fill(c, 
    row("Images", flux ? "local FLUX.2" : "cached only", flux ? "" : "warn",
      flux ? "New AI images are made on this Mac. Click to choose a video's picture style." : "New AI images need the Mac; clips and talk + graphics Shorts work here",
      () => openLookTab(headerReport && (headerReport.stats || {}).rendering_method === "motion" ? (headerReport.show ? "show" : "theme") : "style")),
    row("Voice", health.voice || "?", "", "Default voice of this Mac (.env). Click to change the open video's voice.", () => openLookTab("voice")),
    enc ? row("Encoder", enc, "", "Picked automatically for this machine", () => toast(`Videos are encoded with ${health.encoder}: picked automatically for this machine (VIDEO_ENCODER in .env forces another).`)) : "",
    row("Library", lib || "?", health.music_tracks ? "" : "warn", "Music tracks and sound effects in the library. Click to choose the open video's music.", () => openLookTab("music")));
}
// light / dark / follow the Mac (remembered per browser)
function drawTheme() {
  const seg = $("#themeSeg"), cur = document.documentElement.dataset.theme || "";
  fill(seg, ...[["light", "Light"], ["dark", "Dark"], ["", "System"]].map(([t, l]) =>
    h("button", { type: "button", class: t === cur ? "on" : "", "aria-pressed": String(t === cur), title: t ? `Theme: ${l.toLowerCase()}` : "Theme: follows your Mac",
      onclick: () => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
        try { t ? localStorage.setItem("vs.theme", t) : localStorage.removeItem("vs.theme"); } catch (e) {} drawTheme(); } }, l)));
}
drawTheme();

// ------------------------------------------------------------------ account
let me = {};
function openAccount(part) {
  if (unsaved() && !confirm("You have unsaved script changes. Leave without saving?")) return;
  history.replaceState(null, "", "/"); current = "__account"; data = null; editText = null; closeMenuIfOverlay(); drawJobs(); showAccount(part);
}
async function loadMe() {
  try { me = await api("/api/me"); } catch { me = {}; }
  $("#userbox").replaceChildren(
    h("button", { class: "navlink", type: "button", onclick: () => openAccount() }, me.user || "Account", h("small", {}, "Settings")),
    me.admin ? h("button", { class: "navlink", type: "button", onclick: () => openAccount("people") }, "People who can log in") : "",
    h("button", { class: "navlink", type: "button", onclick: async () => { await api("/api/logout", { method: "POST" }).catch(() => {}); location.replace("/login"); } }, "Log out"));
}
async function showAccount(part) {
  clearTimeout(pollTimer); setHeaderLook(null);
  const m = $("#main"); m.classList.remove("wide");
  fill(m, h("h1", {}, "Account"), h("p", { class: "sub" }, `Signed in as ${me.user}${me.admin ? " (admin)" : ""}.`));
  const cur = h("input", { type: "password", autocomplete: "current-password", class: "inp", id: "pwCur" });
  const nw = h("input", { type: "password", autocomplete: "new-password", class: "inp", id: "pwNew" });
  const nw2 = h("input", { type: "password", autocomplete: "new-password", class: "inp", id: "pwNew2" });
  m.append(h("div", { class: "card" }, h("h3", {}, "Change password"),
    h("div", { class: "formgrid" },
      h("label", { class: "fl", for: "pwCur", style: "margin-top:0" }, "Current password"), cur,
      h("label", { class: "fl", for: "pwNew" }, "New password (at least 10 characters)"), nw,
      h("label", { class: "fl", for: "pwNew2" }, "New password again"), nw2),
    h("div", { class: "actions" }, h("div", { class: "btns", style: "margin-left:0" }, h("button", { class: "btn primary", onclick: async () => {
      if (nw.value !== nw2.value) { toast("The new passwords don't match"); return; }
      try { await api("/api/password", { method: "POST", body: JSON.stringify({ current: cur.value, new: nw.value }) });
        cur.value = nw.value = nw2.value = ""; toast("Password changed"); } catch (e) { toast(e.message); } } }, "Change password")))));
  if (!me.admin) return;
  const list = h("div");
  const draw = async () => { let us = []; try { us = await api("/api/users"); } catch (e) { toast(e.message); }
    fill(list, ...us.map(u => h("div", { class: "userrow" },
      h("b", {}, u.name), h("span", { class: "pill " + (u.admin ? "type" : "") }, u.admin ? "admin" : "user"), h("div", { class: "spacer" }),
      u.name === me.user ? h("span", { class: "hint" }, "you") : h("button", { class: "btn small danger", onclick: async () => {
        if (!confirm(`Remove ${u.name}? They won't be able to log in any more.`)) return;
        try { await api("/api/users/" + encodeURIComponent(u.name), { method: "DELETE" }); draw(); } catch (e) { toast(e.message); } } }, "Remove")))); };
  const un = h("input", { type: "text", autocomplete: "off", class: "inp", placeholder: "username", "aria-label": "New username" });
  const up = h("input", { type: "password", autocomplete: "new-password", class: "inp", placeholder: "password (at least 10 characters)", "aria-label": "New user's password" });
  const people = h("div", { class: "card", id: "people" }, h("h3", {}, "People who can log in"), list,
    h("p", { class: "hint", style: "margin:14px 0 6px" }, "Add someone (they can make videos on this Mac; they can't manage users):"),
    h("div", { class: "row" }, un, up, h("button", { class: "btn", onclick: async () => {
      try { await api("/api/users", { method: "POST", body: JSON.stringify({ username: un.value, password: up.value }) });
        un.value = up.value = ""; toast("Added"); draw(); } catch (e) { toast(e.message); } } }, "Add")));
  m.append(people);
  draw();
  if (part === "people") people.scrollIntoView({ block: "start" });
}

// ---------------------------------------------------------------- Recent videos
let picking = false; const picked = new Set(); let lastJobs = []; let showAllJobs = false;
const BUSY = ["queued", "rendering"];
const RECENT = 8;
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
async function deleteJobs(ids) {
  // moves the job folders to the Trash (server: jobs.delete); queued / rendering ones are refused there
  if (!ids.length) return;
  const one = ids.length === 1 && lastJobs.find(j => j.id === ids[0]);
  const msg = one ? `Delete “${one.title || "Untitled"}”?` : `Delete ${ids.length} videos?`;
  if (!confirm(msg + "\n\nThe folder (script, videos, thumbnails, cache) goes to the Trash, so you can still get it back from there."
    + " A Short clipped from it can't be re-rendered afterwards.")) return;
  let r; try { r = await api("/api/jobs/delete", { method: "POST", body: JSON.stringify({ ids }) }); } catch (e) { toast(e.message); return; }
  r.deleted.forEach(id => picked.delete(id));
  toast(`Moved ${r.deleted.length} to the Trash` + (r.skipped.length ? ` · ${r.skipped.length} skipped (${r.skipped[0].reason})` : ""));
  if (r.deleted.includes(current)) { current = null; location.hash = ""; showNewView(); }
  if (!picked.size) picking = false;
  loadJobs();
}
function drawJobTools(shown, total) {
  const box = $("#jobtools");
  if (!lastJobs.length) { fill(box); return; }
  const more = !picking && total > shown ? h("button", { class: "navlink", type: "button", onclick: () => { showAllJobs = true; drawJobs(); } },
    `Show all ${total} videos`, h("small", { "aria-hidden": "true" }, "→")) : null;
  const fewer = !picking && showAllJobs && total > RECENT && !$("#jobSearch").value.trim()
    ? h("button", { class: "navlink minor", type: "button", onclick: () => { showAllJobs = false; drawJobs(); } }, "Show fewer") : null;
  if (!picking) { fill(box, ...[more, fewer].filter(Boolean),
    h("button", { class: "navlink minor", type: "button", title: "Pick several videos to delete", onclick: () => { picking = true; showAllJobs = true; drawJobs(); } }, "Manage…")); return; }
  const pickWhere = (f) => { lastJobs.filter(j => !BUSY.includes(j.status) && f(j)).forEach(j => picked.add(j.id)); drawJobs(); };
  fill(box, 
    h("span", { class: "n" }, picked.size ? `${picked.size} selected` : "Tick the videos to delete, or pick:"),
    h("button", { class: "btn small", onclick: () => pickWhere(j => j.status === "failed") }, "Failed"),
    h("button", { class: "btn small", onclick: () => pickWhere(j => !j.has_final) }, "Without final"),
    h("button", { class: "btn small", onclick: () => pickWhere(() => true) }, "All"),
    h("button", { class: "btn small primary", disabled: !picked.size, onclick: () => deleteJobs([...picked]) }, `Delete ${picked.size || ""}`.trim()),
    h("button", { class: "btn small quiet", onclick: () => { picked.clear(); picking = false; showAllJobs = false; drawJobs(); } }, "Cancel"));
}
function jobLine(j) {
  // second line under a title: status dot + status + length / % / Short
  const dot = { done: "ok", rendering: "run", queued: "run", draft_ready: "warn", failed: "bad" }[j.status] || "";
  let [label] = STATUS[j.status] || [j.status || "Old test"];
  let extra = j.type === "short" ? "Short" : j.duration ? ts(j.duration) : j.est_seconds ? "~" + ts(j.est_seconds) : "";
  if (j.status === "rendering") { label = `Rendering ${j.mode || ""}`.trim(); extra = j.total ? `${Math.round(100 * j.done / j.total)}%` : (j.stage || ""); }
  return h("span", {}, h("i", { class: "sdot " + dot, "aria-hidden": "true" }), [label, extra].filter(Boolean).join(" · "));
}
function drawJobs() {
  const jobs = lastJobs, q = ($("#jobSearch").value || "").trim().toLowerCase();
  const list = $("#jobs"); fill(list);
  const found = q ? jobs.filter(j => (j.title || "Untitled").toLowerCase().includes(q) || (j.id || "").includes(q)) : jobs;
  const shown = q || showAllJobs || picking ? found : found.slice(0, RECENT);
  if (!jobs.length) list.append(h("div", { class: "empty" }, "No videos yet. Press + Full video or + Short to make the first one."));
  else if (!found.length) list.append(h("div", { class: "empty" }, `No video matches “${q}”.`));
  for (const j of shown) {
    const busy = BUSY.includes(j.status);
    const title = j.title || "Untitled";
    const body = [h("b", { title }, title), jobLine(j)];
    if (picking) {
      const cb = h("input", { type: "checkbox", "aria-label": "Select " + title });
      cb.checked = picked.has(j.id); cb.disabled = busy;
      const flip = () => { if (busy) return; if (picked.has(j.id)) picked.delete(j.id); else picked.add(j.id); drawJobs(); };
      cb.onclick = (e) => { e.stopPropagation(); flip(); };
      list.append(h("div", { class: "vid picking" + (picked.has(j.id) ? " on" : ""), onclick: flip, title: busy ? "Can't delete while it renders" : "" },
        cb, h("div", { style: "min-width:0" }, ...body)));
    } else {
      const del = busy ? null : h("button", { class: "del", type: "button", title: "Delete this video", "aria-label": "Delete " + title,
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); deleteJobs([j.id]); } });
      if (del) del.innerHTML = TRASH;
      list.append(h("a", { class: "vid" + (j.id === current ? " on" : ""), href: "#" + j.id, "aria-current": j.id === current ? "page" : null,
        onclick: (e) => { e.preventDefault(); closeMenuIfOverlay(); select(j.id); } }, ...body, del));
    }
  }
  drawJobTools(shown.length, found.length);
  if (typeof drawSeriesTree === "function" && seriesList.length) drawSeriesTree();
}
$("#jobSearch").addEventListener("input", drawJobs);
async function loadJobs() {
  let jobs; try { jobs = await api("/api/jobs"); } catch { return; }
  lastJobs = jobs;
  document.body.classList.toggle("rendering", jobs.some(j => BUSY.includes(j.status)));
  [...picked].forEach(id => { if (!jobs.some(j => j.id === id)) picked.delete(id); });
  drawJobs();
}

// ---------------------------------------------------------------- web series (pipeline/series, docs/series/SERIES_PLAN.md)
// Routes: #series/<id> = the series page, #series/<id>/<epNN.md> = an episode's script (edit, check, render).
let seriesList = [], seriesOpen = store.get("vs.seriesOpen", {});

async function refresh(force = false) {
  clearTimeout(pollTimer);
  if (!current) { showNewView(); return; }
  window.onbeforeunload = null;
  if (current.startsWith("series/")) {                        // #series/<id> or #series/<id>/<epNN.md>
    const [, sid, file] = current.split("/");
    if (file) showEpisode(sid, file); else showSeries(sid);
    drawSeriesTree(); return;
  }
  let d; try { d = await api("/api/jobs/" + current); } catch { current = null; showNewView(); return; }
  const running = ["queued", "rendering"].includes(d.status);
  const changed = !data || data.status !== d.status || data.mode !== d.mode;
  const prev = data; data = d;
  if (changed && prev && d.status === "done") tab = "final";
  if (changed && prev && d.status === "draft_ready") tab = "draft";
  if (force || changed) showJob();
  else if (running) updateProgress();
  if (running) pollTimer = setTimeout(refresh, 1500);
  if (changed && prev) { loadJobs(); if (!running && (d.status === "draft_ready" || d.status === "done")) toast(d.status === "done" ? "Final video ready" : "Draft ready"); }
}

// metadata.txt (pipeline/jobs._metadata) -> the fields YouTube Studio asks for. The description keeps the chapters and
// music credits (YouTube reads chapters from the description); Chapters is shown on its own too.
function parseMeta(txt) {
  const out = { title: "", description: "", chapters: "", tags: "", checklist: [] };
  const lines = (txt || "").replace(/\r/g, "").split("\n");
  const at = (name) => lines.findIndex(l => l.trim() === name);
  const iT = at("TITLE"), iD = at("DESCRIPTION"), iG = at("TAGS"), iC = at("UPLOAD CHECKLIST");
  if (iT < 0 || iD < 0) return null;
  const block = (a, b) => lines.slice(a + 1, b < 0 ? lines.length : b).join("\n").trim();
  out.title = block(iT, iD);
  out.description = block(iD, iG >= 0 ? iG : iC);
  if (iG >= 0) out.tags = block(iG, iC);
  if (iC >= 0) out.checklist = block(iC, -1).split("\n").map(l => l.replace(/^-\s*/, "").trim()).filter(Boolean);
  const d = out.description.split("\n"), iCh = d.findIndex(l => l.trim() === "Chapters");
  if (iCh >= 0) { const ch = []; for (const l of d.slice(iCh + 1)) { if (!l.trim()) break; ch.push(l); } out.chapters = ch.join("\n"); }
  return out;
}

      !d.final && d.script && (d.check || {}).ok ? h("button", { class: "btn", disabled: running, onclick: () => { rememberChoice("final"); go("final"); } }, "Make final") : null));
    return card;
  }
  card.append(h("p", { class: "hint", style: "margin:2px 0 0" }, isShort ? "Option 1 is the cover in the upload pack; 2 and 3 are alternates."
      : "Upload all three with Test & compare in YouTube Studio."),
    h("div", { class: "thumbs three" + (isShort ? " vert" : "") }, nums.map(i => h("figure", {},
      h("img", { src: file(`thumb_${i}.jpg`), alt: `${isShort && i === 1 ? "Cover" : "Thumbnail option " + i}`, loading: "lazy" }),
      h("figcaption", {}, isShort && i === 1 ? "Cover" : `Option ${i}`, h("a", { href: file(`thumb_${i}.jpg`, "&download=1"), "aria-label": `Download option ${i}` }, "Download"))))));
  return card;
}

// collapsed sections: the open ones are remembered while the same video is on screen
let accOpen = { id: null, open: {} };
function acc(key, title, summary, kids, openDefault = false) {
  if (accOpen.id !== current) accOpen = { id: current, open: {} };
  const open = key in accOpen.open ? accOpen.open[key] : openDefault;
  const el = h("details", { class: "acc", id: "acc-" + key, open, ontoggle: (e) => { accOpen.open[key] = e.target.open; } },
    h("summary", {}, h("span", {}, title), summary, h("span", { class: "car", "aria-hidden": "true" }, "▶")),
    h("div", { class: "accbody" }, ...kids.filter(Boolean)));
  return el;
}
function words(t) { const body = (t || "").replace(/^---\r?\n[\s\S]*?\r?\n---/, "").replace(/\[[^\]]*\]/g, " ").replace(/^#+.*$/gm, " ");
  return (body.match(/[A-Za-z0-9][A-Za-z0-9'’.,$%-]*/g) || []).length; }
function notesList(d, ta) {
  // every warning of the video: the script check (click jumps to the line) + what the renders reported
  const rep = lastReport || d.check || {};
  const cw = (rep.warnings || []);
  const rw = [...new Set([...((d.final || {}).warnings || []), ...((d.draft || {}).warnings || [])])];
  const items = [...cw.map(m => h("li", { class: "w", onclick: () => { const s = $("#acc-script"); if (s) s.open = true; if (ta) jumpTo(ta, m.line); } },
      h("span", { class: "ln" }, `line ${m.line}`), h("span", {}, m.msg))),
    ...rw.map(w => h("li", { class: "w", style: "cursor:default" }, h("span", { class: "ln" }, "render"), h("span", {}, w)))];
  return { count: items.length, el: items.length ? h("ul", { class: "msgs" }, items) : h("p", { class: "hint", style: "margin:0" }, "No warnings for this video.") };
}

function showJob() {
  if (sbOpen && data && data.rendering_method === "motion") { showStoryboard(true); return; }
  if (shOpen && data && data.rendering_method !== "motion") { showShots(); return; }
  const d = data; const m = $("#main"); m.classList.remove("wide"); fill(m);
  const running = ["queued", "rendering"].includes(d.status);
  const ok = (d.check || {}).ok;
  const rendered = !!(d.draft || d.final) || running || d.status === "failed";   // Make final / Draft first was pressed
  const [label, cls] = STATUS[d.status] || [d.status || "old test", ""];
  const info = d.final || d.draft || {};
  m.append(h("div", { class: "jhead" },
    h("div", { class: "tt" }, h("h1", { title: d.title || "Untitled" }, d.title || "Untitled"),
      h("div", { class: "meta-line" }, h("span", { class: "pill " + cls }, label), d.series ? h("span", { class: "pill type" }, `Episode ${d.episode || ""}`.trim()) : null, d.type === "short" ? h("span", { class: "pill type" }, d.clip ? "Short · clip" : "Short") : null,
        h("span", {}, when(d.created)), info.duration_sec ? h("span", {}, "· " + ts(info.duration_sec)) : null,
        info.width ? h("span", {}, `· ${info.width}×${info.height}`) : d.format ? h("span", {}, "· " + d.format) : null)),
    h("div", { class: "btns" },
      d.series ? h("a", { class: "btn", href: "#series/" + d.series, title: "The series bible, cast and all episodes" }, "Series page") : null,
      d.script && !d.series ? h("button", { class: "btn", disabled: !ok || !!d.clip, onclick: d.rendering_method === "motion" ? openStoryboard : openShots,
        title: d.clip ? "A clip Short re-uses another video's shots: open that video's Storyboard to change them"
          : d.rendering_method === "motion" ? "Look at every scene, move and restyle things, regenerate single scenes"
          : "Look at every shot, change its picture, words and options, make a new version of an AI image" }, "Storyboard") : null,
      ...jobButtons(d, running || !ok || !d.script))));
  if (!d.script) m.append(h("div", { class: "banner warn" }, "This is an older test job from before the script.md format. It can be watched but not re-rendered."));
  if (d.status === "failed") {
    const again = h("button", { class: "btn primary", disabled: !ok || !d.script, title: ok ? "Render again: finished voice and images are reused" : "Fix the script's errors first (Script, below)",
      onclick: () => go(d.mode === "draft" ? "draft" : "final") }, "Try again");
    m.append(h("div", { class: "banner bad failbox", role: "alert" },
      h("div", {}, h("b", {}, `The ${d.mode || "render"} didn't finish${d.stage ? " (" + d.stage + ")" : ""}.`),
        h("p", {}, d.error || "No error message was saved; the render log below has the details."),
        h("p", { class: "hint" }, "Fix the script below if needed, then press Try again. Finished voice and AI images are reused.")), again));
  }
  if (d.script) m.append(stepsBar(d));
  if (running) m.append(progressCard());
  const vc = videoCard(d); if (vc) m.append(vc);
  if (vc || d.final || d.files.some(f => f.startsWith("thumb_")) || d.metadata)
    m.append(h("div", { class: "two" }, thumbCard(d, running), ytCard(d)));

  // Script (opens by itself when the check has errors, or before the first render)
  let ta = null;
  if (d.script) { const ed = editorCard(d, rendered); ta = ed.ta;
    const rep = lastReport || d.check || {};
    const nerr = (rep.errors || []).length, saved = !unsaved();
    m.append(acc("script", "Script", h("span", { class: "sub" }, `${words(editText ?? d.script).toLocaleString()} words · ${saved ? "saved" : "unsaved changes"}`),
      [ed.el], nerr > 0 || !rendered));
    if (nerr) $("#acc-script summary").append(h("span", { class: "badge bad" }, `${nerr} error${nerr > 1 ? "s" : ""}`)); }

  // Render details: smoothness check, variety, time per stage, music
  const mo = info.motion || {}, cr = mo.critique, v = mo.variety;
  const details = [];
  if (info.stages && Object.keys(info.stages).length) {
    const tot = Object.values(info.stages).reduce((x, y) => x + y, 0) || 1;
    details.push(h("div", { class: "card" }, h("h3", {}, "Time per stage"),
      h("div", { class: "stagetimes" }, h("span", { class: "hint" }, `${info.style === "motion" ? "Motion" : "Classic"} render:`),
        Object.entries(info.stages).sort((x, y) => STAGE_ORDER.indexOf(x[0]) - STAGE_ORDER.indexOf(y[0])).map(([k, t]) => h("span", { class: "stg", title: `${Math.round(100 * t / tot)}% of the render` },
          h("b", {}, k), ` ${t < 10 ? t.toFixed(1) : Math.round(t)} s`))),
      info.bgm ? h("p", { class: "hint", style: "margin:12px 0 0" }, "Music: " + info.bgm.replace(/\.mp3$/, "").split("---")[0].replace(/-/g, " ")) : null));
  }
  if (cr && cr.first) details.push(critiqueCard(cr, d.id, !!d.final));
  const vcard = varietyCard(v, false); if (vcard) details.push(vcard);
  if (details.length) {
    const sum = [cr && cr.first ? `smoothness ${(cr.last || cr.first).mean}/10` : "", v ? `variety ${v.goals_met} of ${v.goals_total} goals` : "",
      info.stages ? "time per stage" : "", info.bgm ? "music" : ""].filter(Boolean).join(" · ");
    m.append(acc("details", "Render details", h("span", { class: "sub" }, sum), details));
  }

  // Notes: every warning, hidden once a render was asked for
  const notes = notesList(d, ta);
  m.append(acc("notes", "Notes", h("span", { class: "badge" + (notes.count && !rendered ? " warn" : "") },
    notes.count ? `${notes.count} warning${notes.count > 1 ? "s" : ""}${rendered ? ", hidden" : ""}` : "no warnings"), [notes.el], !rendered && notes.count > 0));

  if (!running && d.log_tail && d.log_tail.length && d.status === "failed")
    m.append(acc("log", "Render log", h("span", { class: "sub" }, `last ${d.log_tail.length} lines`), [h("div", { class: "log", style: "margin:0" }, d.log_tail.join("\n"))], true));
}

function editorCard(d, rendered) {
  if (editText === null) editText = d.script;
  const ta = h("textarea", { class: "script", spellcheck: "false", "aria-label": "Script", oninput: (e) => { editText = e.target.value;
    const s = $("#acc-script .sub"); if (s) s.textContent = `${words(editText).toLocaleString()} words · ${unsaved() ? "unsaved changes" : "saved"}`; } });
  ta.value = editText;
  const rep = lastReport || d.check;
  const running = ["queued", "rendering"].includes(d.status);
  const save = async () => {
    try { const r = await api(`/api/jobs/${d.id}/script`, { method: "PUT", body: JSON.stringify({ text: editText }) });
      lastReport = r; data.script = editText; data.check = r; toast(r.ok ? "Saved. No errors." : `Saved, ${r.errors.length} error(s) to fix`);
      const dd = await api("/api/jobs/" + current); data = dd; editText = dd.script; showJob(); loadJobs();
    } catch (e) { toast(e.message); } };
  const out = h("div", { style: "margin-top:18px" }, rep ? report(rep, (ln) => jumpTo(ta, ln), () => editText, { notes: rendered }) : null,
    rep && !running ? lookCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null,
    rep && !running ? iconCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null,
    rep && !running ? thumbsCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null);
  const el = h("div", {},
    ta,
    h("div", { class: "actions" },
      h("span", { class: "hint" }, running ? "Editing is locked while rendering." : "Saving doesn't re-render; press Make final (or Draft first) after."),
      h("div", { class: "btns" }, h("button", { class: "btn", disabled: running, onclick: save }, "Check & save"))),
    out);
  return { el, ta };
}

async function go(mode) {
  if (unsaved() && !confirm("Your script edits aren't saved. Render the saved version anyway?")) return;
  try { await api(`/api/jobs/${current}/render`, { method: "POST", body: JSON.stringify({ mode }) }); refresh(true); loadJobs(); }
  catch (e) { toast(e.message); }
}

(async () => {
  await loadMe(); await loadHealth(); current = location.hash.slice(1) || null; await loadJobs(); loadSeries(); refresh(true);
  setInterval(loadJobs, 5000); setInterval(loadHealth, 30000); setInterval(loadSeries, 15000);
})();
</script>
