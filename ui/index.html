<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Studio</title>
<link rel="stylesheet" href="/ui/studio.css">
<script>try { const t = localStorage.getItem("vs.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><b></b></div>
<header>
  <h1><span class="tally" aria-hidden="true"></span>Video Studio</h1>
  <div class="chips" id="health"></div>
  <div class="row" id="userbox"></div>
</header>
<div class="layout">
  <aside>
    <div class="newbtns newbtn">
      <button class="btn primary" id="shortBtn">Make Short</button>
      <button class="btn primary" id="fullBtn">Make full video</button>
    </div>
    <div class="jobtools" id="jobtools"></div>
    <div class="joblist" id="jobs"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const STATUS = {
  script: ["Script saved", ""], queued: ["Queued", "info"], rendering: ["Rendering", "info"],
  draft_ready: ["Draft ready", "warn"], done: ["Final ready", "ok"], failed: ["Failed", "bad"],
};
const STAGE_ORDER = ["voice", "images + presenter", "visuals", "timeline", "picture (Remotion)", "captions", "audio mix", "encode", "mux"];
const STAGES = ["voice", "visuals", "captions", "audio mix", "encoding", "thumbnails"];
const TYPE_LABEL = { stock: "AI photo", ai: "AI image", card: "card", number: "number", quote: "quote", chart: "chart" };
let health = {}, current = null, data = null, editText = null, lastReport = null, pollTimer = null, tab = null;
let newText = "", newKind = "full", loadedSample = "";   // full | short-choice | short | clip

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json", "X-VS": "1" }, ...opts });
  if (r.status === 401 && path !== "/api/password") { location.replace("/login"); throw new Error("logged out"); }
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
  return body;
}
function dur(s) { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), r = s % 60;
  if (m >= 60) return `${Math.floor(m / 60)} h ${m % 60} min`; return m ? (r ? `${m} min ${r} s` : `${m} min`) : `${r} s`; }
function ts(s) { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function when(t) { const d = new Date(t * 1000); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) +
  " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
const file = (name, extra = "") => `/api/jobs/${current}/file/${name}?v=${Math.round((data && data.updated) || 0)}${extra}`;

// ----------------------------------------------------------------- header
async function loadHealth() {
  try { health = await api("/health"); } catch { health = {}; }
  drawHealth();
}
// Header chips. With a video's Check report on screen they show THAT video's picture style, voice, music and sound
// effects (they change as soon as a Look & sound choice re-checks the script); a click opens that Look & sound tab.
// Without one they show this Mac's defaults.
let headerReport = null;
function setHeaderLook(r) { headerReport = r && !isClip(r) ? r : null; drawHealth(); }
function openLookTab(id) {
  const look = $("#look"), btn = look && look.querySelector(`.ltab[data-tab="${id}"]`);
  if (!btn) { toast(headerReport ? "That choice isn't available for this video" : "Open a video's script and press Check to change this for that video"); return; }
  const det = look.closest("details"); if (det) det.open = true;
  btn.click();
  ($("#look") || look).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
function drawHealth() {
  const c = $("#health"); if (!c) return;
  const r = headerReport, st = (r && r.stats) || {}, motion = st.rendering_method === "motion";
  const chip = (text, cls, title, onclick) => h("button", { class: "chip chipbtn " + cls, type: "button", title, onclick }, text);
  const flux = health.local_image_model;
  const pictures = !r ? chip(flux ? "Images: local FLUX.2" : "Images: cached only on this machine", flux ? "ok" : "warn",
      flux ? "New AI images are made on this Mac. Click to choose a video's picture style." : "New AI images need the Mac; clips and talk + graphics Shorts work here",
      () => openLookTab("style"))
    : motion ? chip(`Pictures: motion graphics${(r.show || {}).label ? ", " + (r.show || {}).label.toLowerCase() + " style" : ""}`, "ok", "This video's style (motion graphics). Click to change it.", () => openLookTab(r.show ? "show" : "theme"))
    : chip(`Art style: ${(r.art_style || {}).label || "default"}`, flux ? "ok" : "warn",
      (flux ? "AI images on this Mac (FLUX.2)." : "New AI images need the Mac.") + " Click to change this video's art style.", () => openLookTab("style"));
  const enc = (health.encoder || "").replace("h264_", "");
  c.replaceChildren(pictures,
    enc ? chip(`Encoder: ${enc}`, "", "Picked automatically for this machine", () => toast(`Videos are encoded with ${health.encoder}: picked automatically for this machine (VIDEO_ENCODER in .env forces another).`)) : "",
    chip(`Voice: ${r ? (r.voice || {}).label || (r.voice || {}).preset || "?" : health.voice || "?"}`, "ok",
      r ? "This video's voice. Click to change it." : "Default voice of this Mac (.env). Click to change a video's voice.", () => openLookTab("voice")),
    chip(`Music: ${r ? musicSummary(r) || "?" : (health.music_tracks ?? "?") + " tracks"}`, r || health.music_tracks ? "" : "warn",
      r ? "This video's music. Click to change it." : "Music tracks in the library. Click to choose a video's music.", () => openLookTab("music")),
    chip(`SFX: ${r ? sfxSummary(r) || "?" : (health.sfx_files ?? "?") + " files"}`, "",
      r ? "This video's sound effects. Click to change them." : "Sound effects in the library. Click to choose a video's sound effects.", () => openLookTab("sfx")));
}

// ------------------------------------------------------------------ account
let me = {};
async function loadMe() {
  try { me = await api("/api/me"); } catch { me = {}; }
  const box = $("#userbox"); box.replaceChildren(
    themeButton(),
    h("span", { class: "hint" }, me.user ? `Signed in as ${me.user}` : ""),
    h("button", { class: "btn small", onclick: () => { history.replaceState(null, "", "/"); current = "__account"; loadJobs(); showAccount(); } }, "Account"),
    h("button", { class: "btn small", onclick: async () => { await api("/api/logout", { method: "POST" }).catch(() => {}); location.replace("/login"); } }, "Log out"));
}
// light / dark / follow the Mac (remembered per browser)
function themeButton() {
  const order = ["", "dark", "light"], label = { "": "Theme: follows your Mac", dark: "Theme: dark", light: "Theme: light" };
  const icon = { "": "◐", dark: "☾", light: "☀" };
  const b = h("button", { class: "btn small themebtn" });
  const draw = () => { const t = document.documentElement.dataset.theme || ""; b.textContent = icon[t]; b.title = label[t] + " (click to change)"; b.setAttribute("aria-label", label[t]); };
  b.onclick = () => { const t = order[(order.indexOf(document.documentElement.dataset.theme || "") + 1) % 3];
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    try { t ? localStorage.setItem("vs.theme", t) : localStorage.removeItem("vs.theme"); } catch (e) {} draw(); };
  draw(); return b;
}
async function showAccount() {
  clearTimeout(pollTimer); setHeaderLook(null);
  const m = $("#main"); m.replaceChildren(h("h2", {}, "Account"), h("p", { class: "sub" }, `Signed in as ${me.user}${me.admin ? " (admin)" : ""}.`));
  const cur = h("input", { type: "password", autocomplete: "current-password", class: "inp" });
  const nw = h("input", { type: "password", autocomplete: "new-password", class: "inp" });
  const nw2 = h("input", { type: "password", autocomplete: "new-password", class: "inp" });
  m.append(h("div", { class: "card" }, h("h3", {}, "Change password"),
    h("div", { class: "hint" }, "Current password"), cur, h("div", { class: "hint", style: "margin-top:8px" }, "New password (at least 10 characters)"), nw,
    h("div", { class: "hint", style: "margin-top:8px" }, "New password again"), nw2,
    h("div", { class: "row", style: "margin-top:12px" }, h("button", { class: "btn primary", onclick: async () => {
      if (nw.value !== nw2.value) { toast("The new passwords don't match"); return; }
      try { await api("/api/password", { method: "POST", body: JSON.stringify({ current: cur.value, new: nw.value }) });
        cur.value = nw.value = nw2.value = ""; toast("Password changed"); } catch (e) { toast(e.message); } } }, "Change password"))));
  if (!me.admin) return;
  const list = h("div");
  const draw = async () => { let us = []; try { us = await api("/api/users"); } catch (e) { toast(e.message); }
    list.replaceChildren(...us.map(u => h("div", { class: "row", style: "padding:6px 0;border-bottom:1px solid var(--line)" },
      h("b", {}, u.name), h("span", { class: "hint" }, u.admin ? "admin" : "user"), h("div", { class: "spacer" }),
      u.name === me.user ? null : h("button", { class: "btn small", onclick: async () => {
        if (!confirm(`Remove ${u.name}? They won't be able to log in any more.`)) return;
        try { await api("/api/users/" + encodeURIComponent(u.name), { method: "DELETE" }); draw(); } catch (e) { toast(e.message); } } }, "Remove")))); };
  const un = h("input", { type: "text", autocomplete: "off", class: "inp", placeholder: "username" });
  const up = h("input", { type: "password", autocomplete: "new-password", class: "inp", placeholder: "password (at least 10 characters)" });
  m.append(h("div", { class: "card" }, h("h3", {}, "People who can log in"), list,
    h("div", { class: "hint", style: "margin-top:12px" }, "Add someone (they can make videos on this Mac; they can't manage users):"),
    h("div", { class: "row", style: "margin-top:6px" }, un, up, h("button", { class: "btn", onclick: async () => {
      try { await api("/api/users", { method: "POST", body: JSON.stringify({ username: un.value, password: up.value }) });
        un.value = up.value = ""; toast("Added"); draw(); } catch (e) { toast(e.message); } } }, "Add"))));
  draw();
}

// ---------------------------------------------------------------- sidebar
let picking = false; const picked = new Set(); let lastJobs = [];
const BUSY = ["queued", "rendering"];
async function deleteJobs(ids) {
  // moves the job folders to the Trash (server: jobs.delete); queued / rendering ones are refused there
  if (!ids.length) return;
  const one = ids.length === 1 && lastJobs.find(j => j.id === ids[0]);
  const msg = one ? `Delete “${one.title || "Untitled"}”?` : `Delete ${ids.length} videos?`;
  if (!confirm(msg + "\n\nThe folder (script, videos, thumbnails, cache) goes to the Trash, so you can still get it back from there."
    + " A Short clipped from it can't be re-rendered afterwards.")) return;
  let r; try { r = await api("/api/jobs/delete", { method: "POST", body: JSON.stringify({ ids }) }); } catch (e) { toast(e.message); return; }
  r.deleted.forEach(id => picked.delete(id));
  toast(`Moved ${r.deleted.length} to the Trash` + (r.skipped.length ? ` · ${r.skipped.length} skipped (${r.skipped[0].reason})` : ""));
  if (r.deleted.includes(current)) { current = null; location.hash = ""; showNewView(); }
  if (!picked.size) picking = false;
  loadJobs();
}
function drawJobTools() {
  const box = $("#jobtools");
  if (!lastJobs.length) { box.replaceChildren(); return; }
  if (!picking) { box.replaceChildren(h("button", { class: "btn small", title: "Pick several videos to delete", onclick: () => { picking = true; loadJobs(); } }, "Select…")); return; }
  const pickWhere = (f) => { lastJobs.filter(j => !BUSY.includes(j.status) && f(j)).forEach(j => picked.add(j.id)); loadJobs(); };
  box.replaceChildren(
    h("button", { class: "btn small", onclick: () => pickWhere(j => j.status === "failed") }, "Failed"),
    h("button", { class: "btn small", onclick: () => pickWhere(j => !j.has_final) }, "Without final"),
    h("button", { class: "btn small", onclick: () => pickWhere(() => true) }, "All"),
    h("button", { class: "btn small", onclick: () => { picked.clear(); picking = false; loadJobs(); } }, "Cancel"),
    h("button", { class: "btn small primary", disabled: !picked.size, onclick: () => deleteJobs([...picked]) }, `Delete ${picked.size || ""}`.trim()),
    h("span", { class: "n" }, picked.size ? `${picked.size} selected` : "tick the videos to delete"));
}
async function loadJobs() {
  let jobs; try { jobs = await api("/api/jobs"); } catch { return; }
  lastJobs = jobs;
  document.body.classList.toggle("rendering", jobs.some(j => BUSY.includes(j.status)));   // background pauses while rendering
  [...picked].forEach(id => { if (!jobs.some(j => j.id === id)) picked.delete(id); });
  const list = $("#jobs"); list.replaceChildren();
  if (!jobs.length) list.append(h("div", { class: "empty" }, "No videos yet."));
  for (const j of jobs) {
    let [label, cls] = STATUS[j.status] || [j.status || "old test", ""];
    if (j.status === "rendering") label = `Rendering ${j.mode || ""}`.trim();
    const len = j.duration ? dur(j.duration) : j.est_seconds ? "~" + dur(j.est_seconds) : "";
    const busy = BUSY.includes(j.status);
    const body = [h("div", { class: "t" }, j.title || "Untitled"),
      h("div", { class: "m" }, h("span", { class: "chip " + cls }, label), j.type === "short" ? h("span", { class: "chip type" }, "Short") : null,
        h("span", {}, [len, when(j.created)].filter(Boolean).join("  ·  ")))];
    if (picking) {
      const cb = h("input", { type: "checkbox", "aria-label": "Select " + (j.title || "video") });
      cb.checked = picked.has(j.id); cb.disabled = busy;
      const flip = () => { if (busy) return; if (picked.has(j.id)) picked.delete(j.id); else picked.add(j.id); cb.checked = picked.has(j.id); drawJobTools(); };
      cb.onclick = (e) => { e.stopPropagation(); flip(); };
      list.append(h("div", { class: "job picking" + (picked.has(j.id) ? " active" : ""), onclick: flip, title: busy ? "Can't delete while it renders" : "" },
        cb, h("div", {}, ...body)));
    } else {
      list.append(h("div", { class: "job" + (j.id === current ? " active" : ""), onclick: () => select(j.id) }, ...body,
        busy ? null : h("button", { class: "del", title: "Delete this video", "aria-label": "Delete " + (j.title || "video"),
          onclick: (e) => { e.stopPropagation(); deleteJobs([j.id]); } }, "🗑")));
    }
  }
  drawJobTools();
}

// ------------------------------------------------------------- navigation
function unsaved() { return editText !== null && data && editText !== data.script; }
function select(id) {
  if (unsaved() && !confirm("You have unsaved script changes. Leave without saving?")) return;
  current = id; data = null; editText = null; lastReport = null; tab = null; sbOpen = false; sb = null; shOpen = false; sh = null; $("#main").classList.remove("wide");
  setHeaderLook(null);
  if ((location.hash.slice(1) || null) !== id) location.hash = id ? "#" + id : "";
  loadJobs(); refresh(true);
}
$("#fullBtn").onclick = () => { newKind = "full"; select(null); showNewView(); };
$("#shortBtn").onclick = () => { newKind = "short-choice"; select(null); showNewView(); };
window.addEventListener("hashchange", () => { const id = location.hash.slice(1) || null; if (id !== current) select(id); });
window.addEventListener("beforeunload", (e) => { if (unsaved() || (!current && newText.trim())) { e.preventDefault(); e.returnValue = ""; } });

async function refresh(force = false) {
  clearTimeout(pollTimer);
  if (!current) { showNewView(); return; }
  let d; try { d = await api("/api/jobs/" + current); } catch { current = null; showNewView(); return; }
  const running = ["queued", "rendering"].includes(d.status);
  const changed = !data || data.status !== d.status || data.mode !== d.mode;
  const prev = data; data = d;
  if (changed && prev && d.status === "done") tab = "final";
  if (changed && prev && d.status === "draft_ready") tab = "draft";
  if (force || changed) showJob();
  else if (running) updateProgress();
  if (running) pollTimer = setTimeout(refresh, 1500);
  if (changed && prev) { loadJobs(); if (!running && (d.status === "draft_ready" || d.status === "done")) toast(d.status === "done" ? "Final video ready" : "Draft ready"); }
}

// --------------------------------------------------------- check report
function motionScenes(r, onJump, getText) {
  // style: motion: the scene list from Check, plus one preview still per scene (rendered on request)
  const s = r.stats || {};
  const tr = (t) => !t ? "first scene" : t.type === "push" ? "push " + (t.dir || "").replace("from-", "from ") : t.type === "zoom" ? `zoom through ${t.target || "centre"}` : t.type;
  const grid = h("div", { class: "scenegrid" });
  const status = h("span", { class: "hint" });
  const btn = h("button", { class: "btn small", disabled: !r.ok || !getText, onclick: async () => {
    btn.disabled = true; status.textContent = "Rendering previews (a few seconds)…";
    try {
      const res = await api("/api/preview", { method: "POST", body: JSON.stringify({ text: getText() }) });
      status.textContent = "";
      res.scenes.forEach((x) => {
        const cell = grid.children[x.scene]; if (!cell) return;
        cell.querySelector(".ph").replaceWith(h("img", { src: `/api/preview/${res.key}/${x.file}`, alt: `Scene ${x.scene + 1}`, loading: "lazy" }));
      });
    } catch (e) { status.textContent = e.message; }
    btn.disabled = false; } }, "Show scene previews");
  (s.scenes || []).forEach((x) => grid.append(h("figure", { onclick: () => onJump && onJump(x.line) },
    h("div", { class: "ph" }, `Scene ${x.index + 1}`),
    h("figcaption", {}, h("b", {}, `${x.index + 1}. ${x.name || x.type}`), h("span", {}, `${ts(x.est_start)} · ~${Math.round(x.est_dur)} s · ${tr(x.transition)}`),
      h("span", {}, x.headline ? `“${x.headline}”` : "no headline"), h("span", {}, `${x.elements} element${x.elements === 1 ? "" : "s"}`)))));
  return h("div", {}, h("div", { class: "row", style: "margin:14px 0 8px" }, h("h3", { style: "margin:0" }, `Scenes (${(s.scenes || []).length})`),
    btn, status), grid);
}

function report(r, onJump, getText) {
  const box = h("div");
  const s = r.stats || {}, by = s.by_type || {};
  if (s.clip) {
    box.append(h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", {}, "Short"), h("span", {}, "clip, vertical 1080×1920")),
      h("div", { class: "stat" }, h("b", {}, dur(s.est_seconds)), h("span", {}, `${ts(s.clip.start)} → ${ts(s.clip.end)}`)),
      h("div", { class: "stat" }, h("b", {}, "0"), h("span", {}, "new AI images (reuses the source)")),
      h("div", { class: "stat" }, h("b", {}, "~" + dur(s.est_final_seconds)), h("span", {}, "render"))));
    box.append(h("p", { class: "hint" }, `From: ${s.clip.source_title}`));
  } else
  box.append(h("div", { class: "stats" },
    h("div", { class: "stat" }, h("b", {}, s.type_label || "Full video"), h("span", {}, s.type === "short" ? "vertical 1080×1920, up to 2:00" : "16:9 1920×1080")),
    h("div", { class: "stat" }, h("b", {}, "~" + dur(s.est_seconds)), h("span", {}, "length (estimated)")),
    h("div", { class: "stat" }, h("b", {}, s.shots ?? 0), h("span", {}, `shots · one every ${s.avg_shot_seconds ?? 0} s`)),
    s.rendering_method === "motion"
      ? h("div", { class: "stat" }, h("b", {}, "~" + (s.motion_scenes ?? 0)), h("span", {}, "animated scenes (a new picture every ~2.6 s, no AI images)"))
      : h("div", { class: "stat" }, h("b", {}, s.ai_images ?? 0), h("span", {}, `AI images (~${health.seconds_per_image || 25} s each)`)),
    h("div", { class: "stat" }, h("b", {}, s.graphics ?? 0), h("span", {}, "cards, numbers, quotes, charts (instant)")),
    s.rendering_method ? h("div", { class: "stat" }, h("b", {}, s.rendering_method_label), h("span", {}, "pictures")) : null,
    r.art_style ? h("div", { class: "stat" }, h("b", {}, r.art_style.label), h("span", {}, `Art style · ${r.art_style.images.new} of ${r.art_style.images.total} AI images still to make`)) : null,
    h("div", { class: "stat" }, h("b", {}, "~" + dur(s.est_draft_seconds)), h("span", {}, "draft render")),
    h("div", { class: "stat" }, h("b", {}, "~" + dur(s.est_final_seconds)), h("span", {}, "final render"))));
  const item = (m, cls) => h("li", { class: cls, onclick: () => onJump && onJump(m.line) }, h("span", { class: "ln" }, `line ${m.line}`), h("span", {}, m.msg));
  if (r.errors.length) box.append(h("h3", {}, `${r.errors.length} error${r.errors.length > 1 ? "s" : ""} to fix before rendering`),
    h("ul", { class: "msgs" }, r.errors.map(m => item(m, "e"))));
  else box.append(h("div", { class: "okline" }, "✓ No errors. Ready to render."));
  if (r.warnings.length) box.append(h("h3", {}, `${r.warnings.length} warning${r.warnings.length > 1 ? "s" : ""}`),
    h("ul", { class: "msgs" }, r.warnings.map(m => item(m, "w"))));
  if (r.chapters && r.chapters.length) box.append(h("p", { class: "hint" }, "Chapters: " + r.chapters.map(c => `${ts(c.est_start)} ${c.title}`).join("  ·  ")));
  if (s.style === "motion" && s.scenes) { box.append(motionScenes(r, onJump, getText)); return box; }
  if (r.shots && r.shots.length) {
    const what = (x) => x.type === "stock" ? x.query : x.type === "ai" ? x.prompt : x.type === "card" ? x.text + (x.sub ? " — " + x.sub : "")
      : x.type === "number" ? `${x.prefix || ""}${x.value}${x.suffix || ""} ${x.label || ""}` : x.type === "quote" ? `“${x.text}” ${x.by ? "— " + x.by : ""}`
      : `${x.chart} chart: ${x.title}`;
    box.append(h("details", { open: r.shots.length <= 40 }, h("summary", {}, `Shot list (${r.shots.length})`),
      h("div", { class: "tscroll" }, h("table", { class: "shots" },

        h("span", { style: "margin-left:10px" }, "End"), eIn, h("button", { class: "btn small", onclick: () => setNow(eIn) }, "Set to now"),
        h("button", { class: "btn small", onclick: () => { if (isNaN(a) || isNaN(b)) return; vid.currentTime = a; stopAt = b; vid.play(); } }, "▶ Preview the clip"),
        lenLine),
      h("div", { class: "hint", style: "margin-top:12px" }, "Title"), title,
      h("div", { class: "row", style: "margin-top:12px" }, makeBtn,
        h("span", { class: "hint" }, "Renders the vertical final straight away (about a minute): Sterling re-centred, captions re-made for Shorts."))));
    upd();
  };
  draw();
  m.append(h("div", { class: "card" }, h("h3", {}, "1. Pick a finished video"), listBox), detail);
}
// script kit per picture style: the prompt(s) to give Claude + the sample script (GET /api/script_kit/<method>)
const kitCache = {};
async function scriptKit(method, kind) {
  const k = `${method}/${kind}`;
  if (!kitCache[k]) kitCache[k] = api(`/api/script_kit/${method}?kind=${kind}`).catch((e) => { delete kitCache[k]; throw e; });
  return kitCache[k];
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove(); return ok;
}
function kitLinks(box, kit) {
  // one "Prompt to give Claude" link + Copy button per prompt of the chosen style
  const many = kit.prompts.length > 1;
  box.replaceChildren(...kit.prompts.map(p => h("span", { class: "row", style: "gap:6px" },
    h("a", { class: "link", href: p.url, target: "_blank", title: `The ${kit.label} script prompt (opens as text)` },
      many ? `Prompt: ${p.label}` : "Prompt to give Claude"),
    h("button", { class: "btn small", type: "button", title: `Copy the ${kit.label}${many ? " / " + p.label : ""} prompt, then paste it into a Claude chat`,
      onclick: async () => {
        let txt = ""; try { txt = await (await fetch(p.url)).text(); } catch {}
        if (!txt || txt.startsWith("<")) { toast("Prompt not found"); return; }
        toast(await copyText(txt) ? `Copied the ${kit.label}${many ? " (" + p.label + ")" : ""} prompt: paste it into Claude` : "Couldn't copy; open the link instead");
      } }, "Copy"))));
}

function showNew(kind = "full") {
  const m = $("#main"); m.replaceChildren();
  const ta = h("textarea", { class: "script", spellcheck: "false", placeholder: kind === "short"
      ? "---\ntitle: ... #Shorts\ntype: short\ncharacter: sterling\n---\n\n[talk: shocked | studio]\nThe surprising fact, first...\n[number: ...]\n..."
      : "---\ntitle: ...\n---\n\n## First chapter\n[stock: ...]\nNarration...",
    oninput: (e) => { newText = e.target.value; createBtn.disabled = true; } });
  ta.value = newText;
  const out = h("div");
  const kitKind = kind === "short" ? "short" : "full";
  const kitBox = h("span", { class: "row", style: "gap:12px" });
  const loadSample = async (method) => {
    let txt = "";
    try { const k = await scriptKit(method, kitKind); txt = await (await fetch(k.sample_url)).text(); } catch {}
    if (!txt || txt.startsWith("<")) { toast("Sample not found"); return false; }
    newText = loadedSample = txt; ta.value = txt; createBtn.disabled = true; doCheck(); return true; };
  const create = async (mode) => {
    finalBtn.disabled = draftBtn.disabled = true; rememberChoice(mode);
    try { const r = await api("/api/jobs", { method: "POST", body: JSON.stringify({ text: withType(newText, kind), render: mode }) });
      newText = ""; select(r.id); } catch (e) { toast(e.message); finalBtn.disabled = draftBtn.disabled = false; } };
  const finalBtn = h("button", { class: "btn", disabled: true, title: "Save and go straight to the final render (no draft)",
    onclick: () => create("final") }, "Make final");
  const draftBtn = h("button", { class: "btn", disabled: true, title: "Save and make a quick low-resolution draft to review first",
    onclick: () => create("draft") }, "Draft first");
  const createBtn = { set disabled(v) { finalBtn.disabled = draftBtn.disabled = v; } };   // both follow Check
  markChoice(finalBtn, draftBtn);
  const doCheck = async () => {
    if (!newText.trim()) { toast("Paste a script first"); return; }
    { const sel = $("#methodSel"), v = (headerValue(newText, "rendering_method") || health.default_rendering_method || "motion").toLowerCase();
      if (sel && METHOD_LABEL[v] && sel.value !== v) { sel.value = v; if (sel._show) sel._show(); } }
    try { const r = await api("/api/check", { method: "POST", body: JSON.stringify({ text: withType(newText, kind) }) });
      out.replaceChildren(h("div", { class: "card" }, h("h3", {}, "Check"), report(r, (ln) => jumpTo(ta, ln), () => withType(newText, kind))),
        lookCard(r, () => newText, (t) => { newText = t; ta.value = t; }, doCheck),
        iconCard(r, () => withType(newText, kind), (t) => { newText = t; ta.value = t; }, doCheck) || "",
        thumbsCard(r, () => withType(newText, kind), (t) => { newText = t; ta.value = t; }, doCheck) || "");
      { const sel = $("#methodSel"), v = (r.stats || {}).rendering_method;   // what the script really gets
        if (sel && METHOD_LABEL[v] && sel.value !== v) { sel.value = v; if (sel._show) sel._show(); } }
      createBtn.disabled = !r.ok; if (r.ok) (lastChoice() === "draft" ? draftBtn : finalBtn).focus();
    } catch (e) { toast(e.message); } };
  const fileIn = h("input", { type: "file", accept: ".md,.txt,text/markdown,text/plain", style: "display:none", onchange: async (e) => {
    const f = e.target.files[0]; if (!f) return; newText = await f.text(); ta.value = newText; createBtn.disabled = true; doCheck(); } });
  m.append(h("h2", {}, kind === "short" ? "New Short (from scratch)" : "New full video"),
    h("p", { class: "sub" }, kind === "short"
      ? "Paste a short script (type: short is added if the header doesn't have it). 15 s to 2:00, hook in the first 2 seconds, end on a line that loops back to the start."
      : "Paste the script.md you wrote with Claude and press Check. Then Make final (straight to the upload files) or Draft first (a quick low-resolution review, then the final)."),
    h("div", { class: "card" },
      h("div", { class: "row", style: "margin-bottom:10px" },
        h("a", { class: "link", href: "/docs/SCRIPT_FORMAT.md", target: "_blank" }, "Script format"),
        kitBox,
        h("div", { class: "spacer" }),
        h("button", { class: "btn small", onclick: () => fileIn.click() }, "Open .md file"), fileIn,
        h("button", { class: "btn small", title: "Loads the sample script of the Pictures choice below (it passes Check)",
          onclick: () => loadSample(($("#methodSel") || {}).value || health.default_rendering_method || "motion") }, "Load sample")),
      methodPicker(() => newText, (t) => { newText = t; ta.value = t; createBtn.disabled = true; }, doCheck, {
        onShow: (v) => { if (v === kitBox._method) return; kitBox._method = v;
          scriptKit(v, kitKind).then((k) => { if (kitBox._method === v) kitLinks(kitBox, k); }).catch((e) => toast(e.message)); },
        // switching style while the box still holds an untouched sample: load that style's sample instead
        onPick: async (v) => (newText.trim() && newText === loadedSample) ? loadSample(v) : false }),
      ta,
      h("div", { class: "row", style: "margin-top:12px" },
        h("button", { class: "btn", onclick: doCheck }, "Check"), finalBtn, draftBtn,
        h("span", { class: "hint", id: "draftHint" }, DRAFT_HINT.motion))),
    out);
  if (newText.trim()) doCheck();
}

// ------------------------------------------------------------------ job view
function stepsBar(d) {
  const st = d.status, mode = d.mode;
  const hasDraft = !!d.draft, hasFinal = !!d.final;
  const cls = (done, now) => "step" + (done ? " done" : now ? " now" : "");
  return h("div", { class: "steps" },
    h("div", { class: cls((d.check || {}).ok, !(d.check || {}).ok) }, h("span", { class: "dot" }, (d.check || {}).ok ? "✓" : "1"), "Script checked"),
    h("div", { class: cls(hasDraft, ["queued", "rendering"].includes(st) && mode === "draft") }, h("span", { class: "dot" }, hasDraft ? "✓" : hasFinal ? "–" : "2"),
      hasFinal && !hasDraft ? "Draft (skipped)" : "Draft (optional)"),
    h("div", { class: cls(hasFinal, ["queued", "rendering"].includes(st) && mode === "final") }, h("span", { class: "dot" }, hasFinal ? "✓" : "3"), "Final + thumbnails"));
}

function progressCard() {
  const d = data;
  const card = h("div", { class: "card", id: "progress" });
  const stages = d.mode === "final" ? STAGES : STAGES.slice(0, 5);
  const idx = stages.indexOf(d.stage);
  const pct = d.total ? Math.round(100 * d.done / d.total) : 0;
  let eta = "";
  if (d.status === "rendering" && d.stage === "visuals" && d.done > 1 && d.render_started) {
    const visualsStartGuess = d.render_started + 5;
    const per = (Date.now() / 1000 - visualsStartGuess) / d.done;
    if (per > 0) eta = ` · about ${dur(per * (d.total - d.done))} left for visuals`;
  }
  const elapsed = d.render_started && d.status === "rendering" ? `running for ${dur(Date.now() / 1000 - d.render_started)}` : "";
  card.append(h("h3", {}, d.status === "queued" ? `Queued: ${d.mode} render (${d.stage})` : `Making the ${d.mode}`),
    h("div", { class: "stages" }, stages.map((s, i) => h("span", { class: i < idx ? "done" : i === idx ? "now" : "" }, s))),
    h("div", { class: "row hint", style: "justify-content:space-between;margin-bottom:6px" },
      h("span", {}, d.total ? `${d.stage}: ${d.done} / ${d.total}${eta}` : (d.stage || "starting")), h("span", {}, elapsed)),
    h("div", { class: "bar" + (d.total ? "" : " indet") }, h("div", { style: `width:${pct}%` })),
    d.log_tail && d.log_tail.length ? h("div", { class: "log" }, d.log_tail.join("\n")) : null,
    h("p", { class: "hint", style: "margin:10px 0 0" }, d.mode === "final"
      ? "The final uses the Mac's GPU for AI images. You can leave this page; progress is saved."
      : "You can leave this page; progress is saved."));
  return card;
}
function updateProgress() { const old = $("#progress"); if (old) old.replaceWith(progressCard()); else showJob(); }

function videoCard(d) {
  const hasDraft = d.files.includes("draft.mp4"), hasFinal = d.files.includes("final.mp4");
  if (!hasDraft && !hasFinal) return null;
  if (!tab || (tab === "final" && !hasFinal) || (tab === "draft" && !hasDraft)) tab = hasFinal ? "final" : "draft";
  const info = d[tab] || {};
  const card = h("div", { class: "card" });
  if (hasDraft && hasFinal) card.append(h("div", { class: "tabs" },
    h("button", { class: tab === "draft" ? "on" : "", onclick: () => { tab = "draft"; showJob(); } }, "Draft"),
    h("button", { class: tab === "final" ? "on" : "", onclick: () => { tab = "final"; showJob(); } }, "Final")));
  card.append(h("video", { src: file(`${tab}.mp4`), controls: true, preload: "metadata" }),
    h("div", { class: "row", style: "margin-top:12px" },
      h("a", { class: "btn" + (tab === "final" ? " primary" : ""), href: file(`${tab}.mp4`, "&download=1") }, `Download ${tab}`),
      h("span", { class: "hint" }, [info.duration_sec ? dur(info.duration_sec) : "", info.width ? `${info.width}×${info.height}` : "",
        info.size_mb ? `${info.size_mb} MB` : "", info.render_seconds ? `made in ${dur(info.render_seconds)}` : "",
        info.bgm ? "music: " + info.bgm.replace(/\.mp3$/, "").split("---")[0].replace(/-/g, " ") : ""].filter(Boolean).join("  ·  "))));
  if (info.stages && Object.keys(info.stages).length) {
    const tot = Object.values(info.stages).reduce((x, y) => x + y, 0) || 1;
    card.append(h("div", { class: "stagetimes" },
      h("span", { class: "hint" }, `${info.style === "motion" ? "Motion" : "Classic"} render, time per stage:`),
      Object.entries(info.stages).sort((x, y) => STAGE_ORDER.indexOf(x[0]) - STAGE_ORDER.indexOf(y[0])).map(([k, v]) => h("span", { class: "stg", title: `${Math.round(100 * v / tot)}% of the render` },
        h("b", {}, k), ` ${v < 10 ? v.toFixed(1) : Math.round(v)} s`))));
  }
  if (tab === "draft") card.append(h("p", { class: "hint", style: "margin:10px 0 0" },
    "Draft: lower resolution, and AI images are placeholders showing their prompt. Check the voice, pacing, captions and graphics."));
  if (info.warnings && info.warnings.length) card.append(h("div", { class: "banner warn", style: "margin:12px 0 0" }, info.warnings.join("\n")));
  return card;
}

function jobButtons(d, off) {
  // before any render: Make final (straight to the final) + Draft first; afterwards re-make either one
  const fresh = !d.draft && !d.final;
  const draftB = h("button", { class: "btn", disabled: off, onclick: () => { rememberChoice("draft"); go("draft"); } },
    d.draft ? "Re-make draft" : fresh ? "Draft first" : "Make draft");
  const finalB = h("button", { class: "btn", disabled: off, onclick: () => { rememberChoice("final"); go("final"); } },
    d.final ? "Re-make final" : "Make final");
  if (fresh) markChoice(finalB, draftB); else finalB.classList.add("primary");
  return fresh ? [finalB, draftB] : [draftB, finalB];
}

function showJob() {
  if (sbOpen && data && data.rendering_method === "motion") { showStoryboard(true); return; }
  if (shOpen && data && data.rendering_method !== "motion") { showShots(); return; }
  const d = data; const m = $("#main"); m.classList.remove("wide"); m.replaceChildren();
  const running = ["queued", "rendering"].includes(d.status);
  const ok = (d.check || {}).ok;
  const [label, cls] = STATUS[d.status] || [d.status || "old test", ""];
  m.append(h("div", { class: "row", style: "align-items:flex-start" },
    h("div", { style: "flex:1;min-width:0" }, h("h2", {}, d.title || "Untitled"),
      h("div", { class: "row hint" }, h("span", { class: "chip " + cls }, label), d.type === "short" ? h("span", { class: "chip type" }, d.clip ? "Short · clip" : "Short") : null,
        when(d.created), d.format ? `· ${d.format}` : "")),
    d.script ? h("button", { class: "btn", disabled: !ok || !!d.clip, onclick: d.rendering_method === "motion" ? openStoryboard : openShots,
      title: d.clip ? "A clip Short re-uses another video's shots: open that video's Storyboard to change them"
        : d.rendering_method === "motion" ? "Look at every scene, move and restyle things, regenerate single scenes"
        : "Look at every shot, change its picture, words and options, make a new version of an AI image" }, "Storyboard") : null,
    ...jobButtons(d, running || !ok || !d.script)));
  if (!d.script) { m.append(h("div", { class: "banner warn", style: "margin-top:16px" }, "This is an older test job from before the script.md format. It can be watched but not re-rendered.")); }
  else m.append(stepsBar(d));
  if (d.status === "failed") m.append(h("div", { class: "banner bad" }, h("b", {}, d.stage || "Failed"), "\n", d.error || "",
    "\nFix the script below if needed, then press the render button again. Finished voice and AI images are reused."));
  if (running) m.append(progressCard());
  const vc = videoCard(d); if (vc) m.append(vc);
  { const v = ((d.final || d.draft || {}).motion || {}).variety; const c = varietyCard(v, false); if (c) m.append(c); }
  { const cr = ((d.final || d.draft || {}).motion || {}).critique; if (cr && cr.first) m.append(critiqueCard(cr, d.id, !!d.final)); }
  const designedOk = d.rendering_method === "motion" && !d.clip && d.script;
  if (d.files.some(f => f.startsWith("thumb_")) || (designedOk && d.final)) {
    const isShort = d.type === "short";
    const remake = designedOk ? h("button", { class: "btn small", disabled: running, title: "Draw the designed thumbnails again from the saved script (no re-render)",
      onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = "Drawing…";
        try { const r = await api(`/api/jobs/${d.id}/thumbnails`, { method: "POST", body: "{}" });
          toast(`Thumbnails remade in ${r.seconds} s` + (r.failed.length ? ` (${r.failed.length} layout(s) dropped)` : ""));
          data = await api("/api/jobs/" + current); showJob(); } catch (e) { toast(e.message); ev.target.disabled = false; ev.target.textContent = "Remake thumbnails"; } } },
      "Remake thumbnails") : null;
    m.append(h("div", { class: "card" }, h("div", { class: "row", style: "margin-bottom:6px" }, h("h3", { style: "margin:0" }, isShort ? "Cover" : "Thumbnails"),
        h("div", { class: "spacer" }), remake),
      h("p", { class: "hint", style: "margin-top:-4px" }, isShort ? "Option 1 is the cover in the upload pack; 2 and 3 are alternates. Pick one as the cover when you upload."
        : "Upload all three in YouTube Studio with “Test & compare” and let YouTube pick the winner."),
      h("div", { class: "thumbs" + (isShort ? " vert" : "") }, [1, 2, 3].filter(i => d.files.includes(`thumb_${i}.jpg`)).map(i => h("figure", {},
        h("img", { src: file(`thumb_${i}.jpg`), alt: `Thumbnail ${i}` }),
        h("figcaption", {}, `Option ${i}`, h("a", { class: "btn small", href: file(`thumb_${i}.jpg`, "&download=1") }, "Download")))))));
  }
  if (d.metadata) m.append(h("div", { class: "card" }, h("div", { class: "row", style: "margin-bottom:10px" }, h("h3", { style: "margin:0" }, "For YouTube Studio"),
      h("div", { class: "spacer" }), h("button", { class: "btn small", onclick: () => { navigator.clipboard.writeText(d.metadata); toast("Copied"); } }, "Copy all")),
    h("pre", { class: "meta" }, d.metadata)));
  if (d.script) m.append(editorCard(d, !d.draft || d.status === "failed" || !ok));
  if (!running && d.log_tail && d.log_tail.length && d.status === "failed") m.append(h("details", { class: "card" }, h("summary", {}, "Render log"), h("div", { class: "log" }, d.log_tail.join("\n"))));
}

function editorCard(d, open) {
  if (editText === null) editText = d.script;
  const ta = h("textarea", { class: "script", spellcheck: "false", oninput: (e) => { editText = e.target.value; } });
  ta.value = editText;
  const rep = lastReport || d.check;
  const running = ["queued", "rendering"].includes(d.status);
  const save = async () => {
    try { const r = await api(`/api/jobs/${d.id}/script`, { method: "PUT", body: JSON.stringify({ text: editText }) });
      lastReport = r; data.script = editText; data.check = r; toast(r.ok ? "Saved. No errors." : `Saved, ${r.errors.length} error(s) to fix`);
      const dd = await api("/api/jobs/" + current); data = dd; editText = dd.script; showJob(); loadJobs();
    } catch (e) { toast(e.message); } };
  const out = h("div", { style: "margin-top:14px" }, rep ? report(rep, (ln) => jumpTo(ta, ln), () => editText) : null,
    rep && !running ? lookCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null,
    rep && !running ? iconCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null,
    rep && !running ? thumbsCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null);
  return h("details", { class: "card", open },
    h("summary", {}, "Script"),
    ta,
    h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "btn", disabled: running, onclick: save }, "Check & save"),
      h("span", { class: "hint" }, running ? "Editing is locked while rendering." : "Saving doesn't re-render; press Make final (or Draft first) after.")),
    out);
}

async function go(mode) {
  if (unsaved() && !confirm("Your script edits aren't saved. Render the saved version anyway?")) return;
  try { await api(`/api/jobs/${current}/render`, { method: "POST", body: JSON.stringify({ mode }) }); refresh(true); loadJobs(); }
  catch (e) { toast(e.message); }
}

(async () => {
  await loadMe(); await loadHealth(); current = location.hash.slice(1) || null; await loadJobs(); refresh(true);
  setInterval(loadJobs, 5000); setInterval(loadHealth, 30000);
})();
