<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Studio</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
  --accent: #c2410c; --accent-ink: #ffffff; --soft: #fff3ec;
  --ok: #15803d; --ok-soft: #e8f6ed; --warn: #a16207; --warn-soft: #fdf6e3;
  --bad: #b91c1c; --bad-soft: #fdecec; --info: #1d4ed8; --info-soft: #ebf0fd;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151517; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #313136;
    --accent: #f97316; --accent-ink: #111; --soft: #2b1d14;
    --ok: #4ade80; --ok-soft: #15281c; --warn: #facc15; --warn-soft: #2a2512;
    --bad: #f87171; --bad-soft: #2c1717; --info: #93b4ff; --info-soft: #18203a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #151517; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #313136;
  --accent: #f97316; --accent-ink: #111; --soft: #2b1d14;
  --ok: #4ade80; --ok-soft: #15281c; --warn: #facc15; --warn-soft: #2a2512;
  --bad: #f87171; --bad-soft: #2c1717; --info: #93b4ff; --info-soft: #18203a; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.chip.info { color: var(--info); background: var(--info-soft); border-color: transparent; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 53px); }
aside { border-right: 1px solid var(--line); padding: 14px; background: var(--panel); }
main { padding: 22px 28px 70px; max-width: 1100px; width: 100%; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; overflow: auto; }
  main { padding: 16px; }
}
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
a.btn { color: var(--ink); }
input.inp { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; outline: none; }
.row input.inp { width: auto; flex: 1; min-width: 160px; }
#userbox { margin-left: 8px; }
a.btn.primary { color: var(--accent-ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.newbtn { width: 100%; justify-content: center; margin-bottom: 12px; }
.joblist { display: flex; flex-direction: column; gap: 4px; }
.job { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.job:hover { background: var(--bg); }
.job.active { background: var(--soft); border-color: var(--line); }
.job .t { font-weight: 550; font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.job .m { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 4px; }
h2 { font-size: 21px; margin: 0 0 4px; letter-spacing: -.015em; }
h3 { font-size: 15px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); margin-bottom: 16px; }
.hint { color: var(--muted); font-size: 13px; }
textarea.script { width: 100%; min-height: 420px; font: 13px/1.55 var(--mono); border: 1px solid var(--line);
  background: var(--bg); border-radius: 8px; padding: 12px; outline: none; resize: vertical; tab-size: 2; }
textarea.script:focus { border-color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--bg); border-radius: 8px; padding: 9px 12px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.msgs { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.msgs li { padding: 7px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; gap: 10px; }
.msgs li.e { background: var(--bad-soft); }
.msgs li.w { background: var(--warn-soft); }
.msgs .ln { font: 12px var(--mono); color: var(--muted); white-space: nowrap; padding-top: 2px; }
.okline { color: var(--ok); font-weight: 600; margin-bottom: 12px; }
table.shots { width: 100%; border-collapse: collapse; font-size: 13px; }
table.shots th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line); }
table.shots td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.shots td.t { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
table.shots td.n { color: var(--muted); }
.tscroll { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.ty { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.ty.stock { background: var(--soft); color: var(--accent); }
.ty.ai { background: var(--soft); color: var(--accent); }
.ty.card, .ty.number, .ty.quote, .ty.chart { background: var(--ok-soft); color: var(--ok); }
.steps { display: flex; gap: 0; margin: 4px 0 18px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding-right: 18px; }
.step .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; }
.step.done { color: var(--ink); } .step.done .dot { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.step.now { color: var(--ink); font-weight: 600; } .step.now .dot { border-color: var(--accent); color: var(--accent); }
.step + .step::before { content: ""; width: 24px; height: 2px; background: var(--line); margin-right: 10px; }
.bar { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .5s; }
.bar.indet > div { width: 30%; animation: slide 1.4s infinite ease-in-out; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.stages { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 8px; }
.stages span { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.stages span.done { color: var(--ok); background: var(--ok-soft); }
.stages span.now { color: var(--accent-ink); background: var(--accent); font-weight: 600; }
.log { font: 12px/1.5 var(--mono); background: var(--bg); border-radius: 8px; padding: 10px; white-space: pre-wrap;
  color: var(--muted); max-height: 200px; overflow: auto; margin-top: 12px; }
video { width: 100%; border-radius: var(--radius); background: #000; display: block; max-height: 70vh; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.tabs button:last-child { border-right: 0; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.thumbs figure { margin: 0; }
.thumbs img { width: 100%; border-radius: 8px; display: block; aspect-ratio: 16/9; object-fit: cover; border: 1px solid var(--line); }
.thumbs.vert { grid-template-columns: repeat(auto-fill, minmax(160px, 220px)); }
.thumbs.vert img { aspect-ratio: 9/16; }
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.style { border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; display: flex;
  flex-direction: column; gap: 3px; background: var(--panel); }
.style:hover { border-color: var(--muted); }
.style.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--soft); }
.style .pv { aspect-ratio: 16/9; border-radius: 6px; background: var(--bg); display: flex; align-items: center;
  justify-content: center; overflow: hidden; margin-bottom: 4px; }
.style .pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.style b { font-size: 14px; }
.style span { font-size: 12px; color: var(--muted); }
.style small { font-size: 11px; color: var(--warn); }
.style .pv video { width: 100%; height: 100%; object-fit: cover; display: block; }
.ltabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 14px; border-bottom: 1px solid var(--line); }
.ltab { border: 0; background: none; color: var(--ink); border-radius: 0; padding: 8px 12px 9px; cursor: pointer; text-align: left; border-bottom: 2px solid transparent;
  margin-bottom: -1px; display: flex; flex-direction: column; gap: 1px; min-width: 96px; }
.ltab b { font-size: 14px; }
.ltab span { font-size: 12px; color: var(--muted); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltab:hover b { color: var(--accent); }
.ltab.on { border-bottom-color: var(--accent); }
.ltab.on b { color: var(--accent); }
.vfilters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.vchip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 12px;
  font-size: 13px; cursor: pointer; }
.vchip.on { border-color: var(--accent); background: var(--soft); color: var(--accent); font-weight: 600; }
.voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 8px; }
.vrow { display: flex; gap: 10px; align-items: center; min-width: 0; }
.vrow > div { min-width: 0; display: flex; flex-direction: column; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--accent);
  cursor: pointer; flex: none; font-size: 13px; line-height: 1; padding: 0; }
.play:hover { border-color: var(--accent); }
.play.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mood { margin: 14px 0 6px; display: flex; gap: 10px; align-items: center; }
.mood b { text-transform: capitalize; }
.cues { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.cues li { padding: 3px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.cues li span:first-child { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 40px; }
.newbtns { display: grid; gap: 8px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choice { text-align: left; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  cursor: pointer; box-shadow: var(--shadow); }
.choice:hover { border-color: var(--accent); }
.choice b { display: block; font-size: 16px; margin-bottom: 4px; }
.choice span { color: var(--muted); font-size: 14px; }
.srclist { display: grid; gap: 6px; max-height: 260px; overflow: auto; }
.src { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.src.on { border-color: var(--accent); background: var(--soft); }
.src .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timebox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.timebox .inp { width: 90px; font-family: var(--mono); }
.bars { display: grid; gap: 4px; margin: 10px 0; }
.barrow { display: grid; grid-template-columns: 110px 1fr 90px; gap: 8px; align-items: center; font-size: 13px; }
.barrow i { display: block; height: 10px; border-radius: 5px; background: var(--accent); }
.barrow b { font-weight: 500; color: var(--muted, inherit); }
ul.goals { list-style: none; padding: 0; margin: 6px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px 12px; font-size: 13px; }
ul.goals li.ok { color: var(--ok); } ul.goals li.bad { color: var(--bad); }
.chip.type { background: var(--info-soft); color: var(--info); }
.icongrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 8px; }
.icontile { margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
.icontile.pin { border-color: var(--accent, #e0a100); }
.icontile img { width: 56px; height: 56px; align-self: center; }
.icontile figcaption { font-size: 12px; display: flex; flex-direction: column; min-height: 3em; overflow: hidden; }
.icontile figcaption span { color: var(--muted, #888); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.icontile .row { gap: 4px; justify-content: center; }
.scenegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.scenegrid figure { margin: 0; cursor: pointer; }
.scenegrid img, .scenegrid .ph { width: 100%; aspect-ratio: 16/9; border-radius: 8px; border: 1px solid var(--line); display: block; object-fit: cover; }
.scenegrid .ph { display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--muted); font-size: 13px; }
.scenegrid figcaption { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; font-size: 13px; }
.scenegrid figcaption span { color: var(--muted); }
.stagetimes { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 10px; }
.stagetimes .stg { font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
.stagetimes .stg b { font-weight: 650; }
 display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; }
pre.meta { white-space: pre-wrap; font: 13px/1.5 var(--mono); background: var(--bg); padding: 12px; border-radius: 8px;
  max-height: 340px; overflow: auto; margin: 0; }
.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; font-size: 14px; border: 1px solid var(--line); }
.banner.bad { background: var(--bad-soft); white-space: pre-wrap; }
.banner.warn { background: var(--warn-soft); }
details > summary { cursor: pointer; font-weight: 600; }
details[open] > summary { margin-bottom: 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.show { opacity: 1; }
a.link { color: var(--info); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Video Studio</h1>
  <div class="chips" id="health"></div>
  <div class="row" id="userbox"></div>
</header>
<div class="layout">
  <aside>
    <div class="newbtns newbtn">
      <button class="btn primary" id="shortBtn">Make Short</button>
      <button class="btn primary" id="fullBtn">Make full video</button>
    </div>
    <div class="joblist" id="jobs"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const STATUS = {
  script: ["Script saved", ""], queued: ["Queued", "info"], rendering: ["Rendering", "info"],
  draft_ready: ["Draft ready", "warn"], done: ["Final ready", "ok"], failed: ["Failed", "bad"],
};
const STAGE_ORDER = ["voice", "images + presenter", "visuals", "timeline", "picture (Remotion)", "captions", "audio mix", "encode", "mux"];
const STAGES = ["voice", "visuals", "captions", "audio mix", "encoding", "thumbnails"];
const TYPE_LABEL = { stock: "AI photo", ai: "AI image", card: "card", number: "number", quote: "quote", chart: "chart" };
let health = {}, current = null, data = null, editText = null, lastReport = null, pollTimer = null, tab = null;
let newText = "", newKind = "full";   // full | short-choice | short | clip

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json", "X-VS": "1" }, ...opts });
  if (r.status === 401 && path !== "/api/password") { location.replace("/login"); throw new Error("logged out"); }
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
  return body;
}
function dur(s) { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), r = s % 60;
  if (m >= 60) return `${Math.floor(m / 60)} h ${m % 60} min`; return m ? (r ? `${m} min ${r} s` : `${m} min`) : `${r} s`; }
function ts(s) { s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function when(t) { const d = new Date(t * 1000); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) +
  " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
const file = (name, extra = "") => `/api/jobs/${current}/file/${name}?v=${Math.round((data && data.updated) || 0)}${extra}`;

// ----------------------------------------------------------------- header
async function loadHealth() {
  try { health = await api("/health"); } catch { health = {}; }
  const c = $("#health"); c.replaceChildren();
  const chip = (t, cls, title) => c.append(h("span", { class: "chip " + cls, title }, t));
  chip(health.local_image_model ? "Images: local FLUX.2" : "Images: cached only on this machine", health.local_image_model ? "ok" : "warn",
       health.local_image_model ? "" : "New AI images need the Mac; clips and talk + graphics Shorts work here");
  if (health.encoder) chip(`Encoder: ${health.encoder.replace("h264_", "")}`, "");
  chip(`Voice: ${health.voice || "?"}`, "ok");
  chip(`Music: ${health.music_tracks ?? "?"} · SFX: ${health.sfx_files ?? "?"}`, health.music_tracks ? "" : "warn");
}

// ------------------------------------------------------------------ account
let me = {};
async function loadMe() {
  try { me = await api("/api/me"); } catch { me = {}; }
  const box = $("#userbox"); box.replaceChildren(
    h("span", { class: "hint" }, me.user ? `Signed in as ${me.user}` : ""),
    h("button", { class: "btn small", onclick: () => { history.replaceState(null, "", "/"); current = "__account"; loadJobs(); showAccount(); } }, "Account"),
    h("button", { class: "btn small", onclick: async () => { await api("/api/logout", { method: "POST" }).catch(() => {}); location.replace("/login"); } }, "Log out"));
}
async function showAccount() {
  clearTimeout(pollTimer);
  const m = $("#main"); m.replaceChildren(h("h2", {}, "Account"), h("p", { class: "sub" }, `Signed in as ${me.user}${me.admin ? " (admin)" : ""}.`));
  const cur = h("input", { type: "password", autocomplete: "current-password", class: "inp" });
  const nw = h("input", { type: "password", autocomplete: "new-password", class: "inp" });
  const nw2 = h("input", { type: "password", autocomplete: "new-password", class: "inp" });
  m.append(h("div", { class: "card" }, h("h3", {}, "Change password"),
    h("div", { class: "hint" }, "Current password"), cur, h("div", { class: "hint", style: "margin-top:8px" }, "New password (at least 10 characters)"), nw,
    h("div", { class: "hint", style: "margin-top:8px" }, "New password again"), nw2,

        h("button", { class: "btn small", title: "Loads the sample for the Pictures choice below (Motion graphics: the Nvidia honey-trap story)", onclick: async () => {
          const motion = ($("#methodSel") || {}).value === "motion";
          try { newText = await (await fetch(motion ? "/docs/sample_motion" : "/docs/sample")).text(); } catch { newText = ""; }
          if (!newText || newText.startsWith("<")) { toast("Sample not found"); return; } ta.value = newText; doCheck(); } }, "Load sample")),
      methodPicker(() => newText, (t) => { newText = t; ta.value = t; createBtn.disabled = true; }, doCheck),
      ta,
      h("div", { class: "row", style: "margin-top:12px" },
        h("button", { class: "btn", onclick: doCheck }, "Check"), finalBtn, draftBtn,
        h("span", { class: "hint", id: "draftHint" }, DRAFT_HINT.motion))),
    out);
  if (newText.trim()) doCheck();
}

// ------------------------------------------------------------------ job view
function stepsBar(d) {
  const st = d.status, mode = d.mode;
  const hasDraft = !!d.draft, hasFinal = !!d.final;
  const cls = (done, now) => "step" + (done ? " done" : now ? " now" : "");
  return h("div", { class: "steps" },
    h("div", { class: cls((d.check || {}).ok, !(d.check || {}).ok) }, h("span", { class: "dot" }, (d.check || {}).ok ? "✓" : "1"), "Script checked"),
    h("div", { class: cls(hasDraft, ["queued", "rendering"].includes(st) && mode === "draft") }, h("span", { class: "dot" }, hasDraft ? "✓" : hasFinal ? "–" : "2"),
      hasFinal && !hasDraft ? "Draft (skipped)" : "Draft (optional)"),
    h("div", { class: cls(hasFinal, ["queued", "rendering"].includes(st) && mode === "final") }, h("span", { class: "dot" }, hasFinal ? "✓" : "3"), "Final + thumbnails"));
}

function progressCard() {
  const d = data;
  const card = h("div", { class: "card", id: "progress" });
  const stages = d.mode === "final" ? STAGES : STAGES.slice(0, 5);
  const idx = stages.indexOf(d.stage);
  const pct = d.total ? Math.round(100 * d.done / d.total) : 0;
  let eta = "";
  if (d.status === "rendering" && d.stage === "visuals" && d.done > 1 && d.render_started) {
    const visualsStartGuess = d.render_started + 5;
    const per = (Date.now() / 1000 - visualsStartGuess) / d.done;
    if (per > 0) eta = ` · about ${dur(per * (d.total - d.done))} left for visuals`;
  }
  const elapsed = d.render_started && d.status === "rendering" ? `running for ${dur(Date.now() / 1000 - d.render_started)}` : "";
  card.append(h("h3", {}, d.status === "queued" ? `Queued: ${d.mode} render (${d.stage})` : `Making the ${d.mode}`),
    h("div", { class: "stages" }, stages.map((s, i) => h("span", { class: i < idx ? "done" : i === idx ? "now" : "" }, s))),
    h("div", { class: "row hint", style: "justify-content:space-between;margin-bottom:6px" },
      h("span", {}, d.total ? `${d.stage}: ${d.done} / ${d.total}${eta}` : (d.stage || "starting")), h("span", {}, elapsed)),
    h("div", { class: "bar" + (d.total ? "" : " indet") }, h("div", { style: `width:${pct}%` })),
    d.log_tail && d.log_tail.length ? h("div", { class: "log" }, d.log_tail.join("\n")) : null,
    h("p", { class: "hint", style: "margin:10px 0 0" }, d.mode === "final"
      ? "The final uses the Mac's GPU for AI images. You can leave this page; progress is saved."
      : "You can leave this page; progress is saved."));
  return card;
}
function updateProgress() { const old = $("#progress"); if (old) old.replaceWith(progressCard()); else showJob(); }

function videoCard(d) {
  const hasDraft = d.files.includes("draft.mp4"), hasFinal = d.files.includes("final.mp4");
  if (!hasDraft && !hasFinal) return null;
  if (!tab || (tab === "final" && !hasFinal) || (tab === "draft" && !hasDraft)) tab = hasFinal ? "final" : "draft";
  const info = d[tab] || {};
  const card = h("div", { class: "card" });
  if (hasDraft && hasFinal) card.append(h("div", { class: "tabs" },
    h("button", { class: tab === "draft" ? "on" : "", onclick: () => { tab = "draft"; showJob(); } }, "Draft"),
    h("button", { class: tab === "final" ? "on" : "", onclick: () => { tab = "final"; showJob(); } }, "Final")));
  card.append(h("video", { src: file(`${tab}.mp4`), controls: true, preload: "metadata" }),
    h("div", { class: "row", style: "margin-top:12px" },
      h("a", { class: "btn" + (tab === "final" ? " primary" : ""), href: file(`${tab}.mp4`, "&download=1") }, `Download ${tab}`),
      h("span", { class: "hint" }, [info.duration_sec ? dur(info.duration_sec) : "", info.width ? `${info.width}×${info.height}` : "",
        info.size_mb ? `${info.size_mb} MB` : "", info.render_seconds ? `made in ${dur(info.render_seconds)}` : "",
        info.bgm ? "music: " + info.bgm.replace(/\.mp3$/, "").split("---")[0].replace(/-/g, " ") : ""].filter(Boolean).join("  ·  "))));
  if (info.stages && Object.keys(info.stages).length) {
    const tot = Object.values(info.stages).reduce((x, y) => x + y, 0) || 1;
    card.append(h("div", { class: "stagetimes" },
      h("span", { class: "hint" }, `${info.style === "motion" ? "Motion" : "Classic"} render, time per stage:`),
      Object.entries(info.stages).sort((x, y) => STAGE_ORDER.indexOf(x[0]) - STAGE_ORDER.indexOf(y[0])).map(([k, v]) => h("span", { class: "stg", title: `${Math.round(100 * v / tot)}% of the render` },
        h("b", {}, k), ` ${v < 10 ? v.toFixed(1) : Math.round(v)} s`))));
  }
  if (tab === "draft") card.append(h("p", { class: "hint", style: "margin:10px 0 0" },
    "Draft: lower resolution, and AI images are placeholders showing their prompt. Check the voice, pacing, captions and graphics."));
  if (info.warnings && info.warnings.length) card.append(h("div", { class: "banner warn", style: "margin:12px 0 0" }, info.warnings.join("\n")));
  return card;
}

function jobButtons(d, off) {
  // before any render: Make final (straight to the final) + Draft first; afterwards re-make either one
  const fresh = !d.draft && !d.final;
  const draftB = h("button", { class: "btn", disabled: off, onclick: () => { rememberChoice("draft"); go("draft"); } },
    d.draft ? "Re-make draft" : fresh ? "Draft first" : "Make draft");
  const finalB = h("button", { class: "btn", disabled: off, onclick: () => { rememberChoice("final"); go("final"); } },
    d.final ? "Re-make final" : "Make final");
  if (fresh) markChoice(finalB, draftB); else finalB.classList.add("primary");
  return fresh ? [finalB, draftB] : [draftB, finalB];
}

function showJob() {
  const d = data; const m = $("#main"); m.replaceChildren();
  const running = ["queued", "rendering"].includes(d.status);
  const ok = (d.check || {}).ok;
  const [label, cls] = STATUS[d.status] || [d.status || "old test", ""];
  m.append(h("div", { class: "row", style: "align-items:flex-start" },
    h("div", { style: "flex:1;min-width:0" }, h("h2", {}, d.title || "Untitled"),
      h("div", { class: "row hint" }, h("span", { class: "chip " + cls }, label), d.type === "short" ? h("span", { class: "chip type" }, d.clip ? "Short · clip" : "Short") : null,
        when(d.created), d.format ? `· ${d.format}` : "")),
    ...jobButtons(d, running || !ok || !d.script)));
  if (!d.script) { m.append(h("div", { class: "banner warn", style: "margin-top:16px" }, "This is an older test job from before the script.md format. It can be watched but not re-rendered.")); }
  else m.append(stepsBar(d));
  if (d.status === "failed") m.append(h("div", { class: "banner bad" }, h("b", {}, d.stage || "Failed"), "\n", d.error || "",
    "\nFix the script below if needed, then press the render button again. Finished voice and AI images are reused."));
  if (running) m.append(progressCard());
  const vc = videoCard(d); if (vc) m.append(vc);
  { const v = ((d.final || d.draft || {}).motion || {}).variety; const c = varietyCard(v, false); if (c) m.append(c); }
  if (d.files.some(f => f.startsWith("thumb_"))) {
    const isShort = d.type === "short";
    m.append(h("div", { class: "card" }, h("h3", {}, isShort ? "Cover" : "Thumbnails"),
      h("p", { class: "hint", style: "margin-top:-4px" }, isShort ? "Shorts mostly show a frame; pick this as the cover when you upload."
        : "Upload all three in YouTube Studio with “Test & compare” and let YouTube pick the winner."),
      h("div", { class: "thumbs" + (isShort ? " vert" : "") }, [1, 2, 3].filter(i => d.files.includes(`thumb_${i}.jpg`)).map(i => h("figure", {},
        h("img", { src: file(`thumb_${i}.jpg`), alt: `Thumbnail ${i}` }),
        h("figcaption", {}, `Option ${i}`, h("a", { class: "btn small", href: file(`thumb_${i}.jpg`, "&download=1") }, "Download")))))));
  }
  if (d.metadata) m.append(h("div", { class: "card" }, h("div", { class: "row", style: "margin-bottom:10px" }, h("h3", { style: "margin:0" }, "For YouTube Studio"),
      h("div", { class: "spacer" }), h("button", { class: "btn small", onclick: () => { navigator.clipboard.writeText(d.metadata); toast("Copied"); } }, "Copy all")),
    h("pre", { class: "meta" }, d.metadata)));
  if (d.script) m.append(editorCard(d, !d.draft || d.status === "failed" || !ok));
  if (!running && d.log_tail && d.log_tail.length && d.status === "failed") m.append(h("details", { class: "card" }, h("summary", {}, "Render log"), h("div", { class: "log" }, d.log_tail.join("\n"))));
}

function editorCard(d, open) {
  if (editText === null) editText = d.script;
  const ta = h("textarea", { class: "script", spellcheck: "false", oninput: (e) => { editText = e.target.value; } });
  ta.value = editText;
  const rep = lastReport || d.check;
  const running = ["queued", "rendering"].includes(d.status);
  const save = async () => {
    try { const r = await api(`/api/jobs/${d.id}/script`, { method: "PUT", body: JSON.stringify({ text: editText }) });
      lastReport = r; data.script = editText; data.check = r; toast(r.ok ? "Saved. No errors." : `Saved, ${r.errors.length} error(s) to fix`);
      const dd = await api("/api/jobs/" + current); data = dd; editText = dd.script; showJob(); loadJobs();
    } catch (e) { toast(e.message); } };
  const out = h("div", { style: "margin-top:14px" }, rep ? report(rep, (ln) => jumpTo(ta, ln), () => editText) : null,
    rep && !running ? lookCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null,
    rep && !running ? iconCard(rep, () => editText, (t) => { editText = t; ta.value = t; }, save) : null);
  return h("details", { class: "card", open },
    h("summary", {}, "Script"),
    ta,
    h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "btn", disabled: running, onclick: save }, "Check & save"),
      h("span", { class: "hint" }, running ? "Editing is locked while rendering." : "Saving doesn't re-render; press Make final (or Draft first) after.")),
    out);
}

async function go(mode) {
  if (unsaved() && !confirm("Your script edits aren't saved. Render the saved version anyway?")) return;
  try { await api(`/api/jobs/${current}/render`, { method: "POST", body: JSON.stringify({ mode }) }); refresh(true); loadJobs(); }
  catch (e) { toast(e.message); }
}

(async () => {
  await loadMe(); await loadHealth(); current = location.hash.slice(1) || null; await loadJobs(); refresh(true);
  setInterval(loadJobs, 5000); setInterval(loadHealth, 30000);
})();
</script>
</body>
</html>
